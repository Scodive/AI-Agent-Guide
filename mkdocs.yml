site_name: AI-Agent-Guide
site_description: 人工精选、可核验的 AI Agent 研究指南与论文库。
site_url: https://scodive.github.io/AI-Agent-Guide/
repo_url: https://github.com/Scodive/AI-Agent-Guide
repo_name: Scodive/AI-Agent-Guide

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - zh
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/papers.css

extra_javascript:
  - assets/papers.js

nav:
  - 首页: index.md
  - 新手阅读路线: reading-path.md
  - 论文库: papers.md
  - 本月精选: monthly-picks.md
  - Agent Harness 与 Coding Agent: harness.md
  - RSI 与自我改进: rsi.md
  - 中文完整指南: guide-zh.md
  - English guide: guide-en.md
  - 收录标准与每周 SOP: update-sop.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Scodive/AI-Agent-Guide
  analytics:
    provider: google

copyright: Copyright &copy; 2026 Scodive | MIT License
